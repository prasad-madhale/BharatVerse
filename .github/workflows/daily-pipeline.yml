name: Daily article pipeline

on:
  # Schedule trigger intentionally disabled until the pipeline's output quality
  # is confirmed reliable -- see docs/roadmap.md Phase 4.
  # Re-enable by uncommenting below once satisfied.
  # schedule:
  #   - cron: '30 3 * * *'  # 03:30 UTC / ~9AM IST
  workflow_dispatch:
    inputs:
      backlog:
        description: "Schedule this many articles, one on each of the next days with none (0: one for today)"
        default: "0"
      publish_on:
        description: "Or publish one on this day, YYYY-MM-DD (empty: today in India)"
        default: ""

permissions:
  contents: read
  issues: write  # the failure alert below

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scrapper/requirements.txt
        pip install -r backend/requirements.txt

    - name: Install Playwright browsers
      run: playwright install --with-deps chromium

    - name: Run the daily content pipeline
      # A scheduled run has no inputs, so it publishes one article for today
      run: |
        if [ "${BACKLOG:-0}" != "0" ]; then
          python scrapper/scrapper_main.py --backlog "$BACKLOG"
        elif [ -n "$PUBLISH_ON" ]; then
          python scrapper/scrapper_main.py --count 1 --publish-on "$PUBLISH_ON"
        else
          python scrapper/scrapper_main.py --count 1
        fi
      env:
        BACKLOG: ${{ inputs.backlog }}
        PUBLISH_ON: ${{ inputs.publish_on }}
        # Google AI Studio's free tier, on the owner's own key: Gemma 4 writes, Gemini Flash (a
        # different model) reviews the text, and Flash-Lite checks every image -- one call per image
        # per round, which on Flash itself ran into its free rate limit and went unchecked. Every
        # model role is named here: unset, the image check would fall back to a local Ollama model,
        # which CI does not have, and images would go unchecked.
        LLM_PROVIDER: gemini
        LLM_MODEL: gemma-4-31b-it
        CRITIC_LLM_PROVIDER: gemini
        CRITIC_LLM_MODEL: gemini-3.8-flash
        IMAGE_COHESION_LLM_PROVIDER: gemini
        IMAGE_COHESION_LLM_MODEL: gemini-3.5-flash-lite
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    # Requirement 11.5: a failed run (an error, or fewer articles published than asked) opens an
    # issue, or comments on the one already open, so it reaches the owner.
    - name: Report a failed run
      if: failure()
      run: scripts/report_pipeline_failure.sh
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
