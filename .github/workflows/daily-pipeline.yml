name: Daily article pipeline

on:
  # Schedule trigger intentionally disabled until the pipeline's output quality
  # is confirmed reliable -- see docs/roadmap.md Phase 4.
  # Re-enable by uncommenting below once satisfied.
  # schedule:
  #   - cron: '30 3 * * *'  # 03:30 UTC / ~9AM IST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write  # the failure alert below

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scrapper/requirements.txt
        pip install -r backend/requirements.txt

    - name: Install Playwright browsers
      run: playwright install --with-deps chromium

    - name: Run the daily content pipeline
      run: python scrapper/scrapper_main.py --count 1
      env:
        # Every model role is named here: unset, the image check would fall back to a local
        # Ollama model, which CI does not have, and images would go unchecked.
        LLM_PROVIDER: openrouter
        LLM_MODEL: google/gemma-4-31b-it
        CRITIC_LLM_PROVIDER: openrouter
        CRITIC_LLM_MODEL: qwen/qwen2.5-vl-72b-instruct
        IMAGE_COHESION_LLM_PROVIDER: openrouter
        IMAGE_COHESION_LLM_MODEL: qwen/qwen2.5-vl-72b-instruct
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    # Requirement 11.5: a failed run (an error, or fewer articles published than asked) opens an
    # issue, or comments on the one already open, so it reaches the owner.
    - name: Report a failed run
      if: failure()
      run: scripts/report_pipeline_failure.sh
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
