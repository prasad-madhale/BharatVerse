name: bharatverse_app
description: BharatVerse mobile app - daily AI-curated Indian history articles.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  http: ^1.6.0
  flutter_markdown_plus: ^1.0.7
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.0
  porter_2_stemmer: ^3.0.2
  url_launcher: ^6.3.2
  cached_network_image: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  plugin_platform_interface: ^2.1.8  # mocks url_launcher's platform channel in citation_item_test.dart
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/onboarding/

# Regenerate with `dart run flutter_launcher_icons` after changing assets/icon/*.png -- see
# README.md. The mark and colors match the web app's icons (web/icons/, not managed by this tool).
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#C1652F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true